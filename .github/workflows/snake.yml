name: Contribution snake

# Renders the contribution grid as a snake eating your commits, and pushes
# the SVGs to a dedicated `output` branch so they never clutter main.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # The first colour in color_dots is the EMPTY cell. On the dark
          # variant it has to be a visible slate - against GitHub's #0d1117
          # page a near-black empty cell vanishes and the grid reads as
          # broken rather than empty.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00C58E&color_dots=#2d3343,#0e4f42,#12806a,#00b083,#3ff0bd
            dist/snake-light.svg?palette=github-light&color_snake=#00966F&color_dots=#e7edf6,#c3ecdf,#7fd9bd,#33b894,#00966F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
