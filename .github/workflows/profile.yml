name: Profile cards

# Regenerates every stat card in assets/ from live GitHub data and commits
# them. Because the SVGs live in this repo, the profile never depends on a
# third-party rendering service that can rate-limit, 402, or disappear.

on:
  schedule:
    - cron: "15 * * * *"        # hourly, off the minute to dodge the
  workflow_dispatch:           # stampede of every cron job set to :00
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # PROFILE_TOKEN is optional. Without it this falls back to the
          # automatic GITHUB_TOKEN, which sees public data only - private
          # repositories and their commits are excluded from the counts.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build_profile.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
