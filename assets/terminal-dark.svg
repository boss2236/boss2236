<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-label="Terminal showing Muntasir Mahmud's status">
  <defs>
    <clipPath id="typeclip"><rect class="typemask" x="42" y="240" width="230" height="20"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .li { animation: fadein .5s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .typemask { animation: type 2.2s steps(27, end) 2s both; }
    @keyframes type { from { width: 0; } to { width: 230; } }

    .caret { animation: caret 1.1s steps(2, start) infinite; }
    @keyframes caret { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .prompt { fill: #00C58E; }
    .cmd { fill: #e6edf7; }
    .out { fill: #9fb3c8; }
    .res { fill: #7fd9bd; }
    .dim { fill: #55657e; }
  </style>

  <rect x=".5" y=".5" width="699" height="339" rx="12" fill="#0d1526" stroke="#1e2b45"/>
  <rect x="0" y="0" width="4" height="340" rx="2" fill="#00C58E"/>

  <rect y="0" width="700" height="36" fill="#131c2b"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="5" fill="#27c93f"/>
  <text x="350" y="24" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#55657e">muntasir@boss2236: ~/dev &#8212; zsh</text>
  <text x="676" y="24" text-anchor="end" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#55657e">80x24</text>

  <text class="li" x="24" y="70" style="animation-delay:.2s" font-family="'Fira Code',Consolas,monospace" font-size="14">
    <tspan class="prompt">$</tspan><tspan class="dim"> </tspan><tspan class="cmd">whoami</tspan>
  </text>
  <text class="li out" x="24" y="96" style="animation-delay:.55s" font-family="'Fira Code',Consolas,monospace" font-size="14">muntasir &#183; self-taught developer &#183; full-stack tinkerer</text>

  <text class="li" x="24" y="132" style="animation-delay:.9s" font-family="'Fira Code',Consolas,monospace" font-size="14">
    <tspan class="prompt">$</tspan><tspan class="dim"> </tspan><tspan class="cmd">cat philosophy.txt</tspan>
  </text>
  <text class="li out" x="24" y="158" style="animation-delay:1.25s" font-family="'Fira Code',Consolas,monospace" font-size="14">"If I do it twice, it should have been a script."</text>

  <text class="li" x="24" y="194" style="animation-delay:1.6s" font-family="'Fira Code',Consolas,monospace" font-size="14">
    <tspan class="prompt">$</tspan><tspan class="dim"> </tspan><tspan class="cmd">./build --automate</tspan>
  </text>
  <text class="li res" x="24" y="220" style="animation-delay:1.95s" font-family="'Fira Code',Consolas,monospace" font-size="14">self-operating e-commerce &#183; React &#183; AI embeddings</text>

  <g class="li" style="animation-delay:2.3s">
    <text x="24" y="256" font-family="'Fira Code',Consolas,monospace" font-size="14">
      <tspan class="prompt">$</tspan><tspan class="dim"> </tspan>
    </text>
    <text x="42" y="256" font-family="'Fira Code',Consolas,monospace" font-size="14" class="res" textLength="230" lengthAdjust="spacing" clip-path="url(#typeclip)">./keep_building --forever</text>
    <rect class="caret" x="278" y="244" width="8" height="18" rx="2" fill="#00C58E"/>
  </g>
</svg>
