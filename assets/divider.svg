<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C58E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00C58E"/>
      <stop offset="1" stop-color="#0083B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lineclip"><rect x="250" y="6.75" width="700" height="2.5" rx="1.25"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .shimmer { transform-origin: 250px 8px; animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-120px); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translateX(700px); opacity: 1; }
      60%  { opacity: 0; }
      100% { transform: translateX(700px); opacity: 0; }
    }

    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3s ease-in-out infinite; }
    @keyframes spark {
      0%,100% { transform: scale(1); opacity: .85; }
      50%     { transform: scale(1.6); opacity: 1; }
    }
    .glow { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
    @keyframes glow {
      0%,100% { opacity: .25; }
      50%     { opacity: .7; }
    }
  </style>

  <rect x="250" y="6.75" width="700" height="2.5" rx="1.25" fill="url(#line)"/>
  <rect class="shimmer" x="0" y="4" width="120" height="8" fill="url(#shine)" clip-path="url(#lineclip)"/>
  <circle class="glow" cx="600" cy="8" r="12" fill="#00C58E"/>
  <circle class="spark" cx="600" cy="8" r="3.5" fill="#3ff0bd"/>
</svg>
