<svg xmlns="http://www.w3.org/2000/svg" width="460" height="178"
     viewBox="0 0 460 178" role="img" aria-label="Activity">
  <style>
    .bg   { fill:#111a2e; stroke:#1e2b45; stroke-width:1; }
    .ttl  { fill:#e6edf7; font:600 14px 'Segoe UI',Ubuntu,Helvetica,sans-serif; }
    .lbl  { fill:#8899b3;  font:400 11px 'Segoe UI',Ubuntu,Helvetica,sans-serif; }
    .val  { fill:#e6edf7; font:700 22px 'Segoe UI',Ubuntu,Helvetica,sans-serif; }
    .acc  { fill:#00C58E; }
    /* fill-mode is 'backwards', never 'forwards' with a 0-opacity base rule.
       An SVG embedded as an image may never get to run its animation -
       reduced motion, a still renderer, a screenshot pipeline - and it must
       still show the numbers. Base state is therefore fully visible; the
       animation only borrows the hidden state during its delay.
       Note: no angle brackets in this comment. Style content is parsed as
       XML markup, so a stray tag name here kills the whole document. */
    .rise { animation:rise .6s ease-out backwards; }
    @keyframes rise { from { opacity:0; transform:translateY(6px); }
                        to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation:none; }
    }
    
  </style>
  <rect class="bg" x=".5" y=".5" width="459" height="177" rx="10"/>
  <rect x="0" y="0" width="4" height="178" rx="2" fill="#00C58E"/>
  <text class="ttl" x="20" y="30">Activity</text>
  <text class="lbl" x="20" y="48">building for 16 months &#183; 0 day streak &#183; best 8</text>
  <g class="rise" style="animation-delay:0.00s">
    <text class="val" x="24" y="78">10</text>
    <text class="lbl" x="24" y="95">Repositories</text>
  </g>
  <g class="rise" style="animation-delay:0.06s">
    <text class="val" x="172" y="78">32</text>
    <text class="lbl" x="172" y="95">Commits</text>
  </g>
  <g class="rise" style="animation-delay:0.12s">
    <text class="val" x="320" y="78">484</text>
    <text class="lbl" x="320" y="95">Contributions</text>
  </g>
  <g class="rise" style="animation-delay:0.18s">
    <text class="val" x="24" y="140">2</text>
    <text class="lbl" x="24" y="157">Pull requests</text>
  </g>
  <g class="rise" style="animation-delay:0.24s">
    <text class="val" x="172" y="140">9</text>
    <text class="lbl" x="172" y="157">Issues</text>
  </g>
  <g class="rise" style="animation-delay:0.30s">
    <text class="val" x="320" y="140">2</text>
    <text class="lbl" x="320" y="157">Followers</text>
  </g>
</svg>
