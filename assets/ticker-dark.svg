    <image href="https://skillicons.dev/icons?i=react,ts,js,html,css,bootstrap,python,nodejs,java,mysql,mongodb,n8n,tensorflow,sklearn,git,github,vercel,cloudflare,unreal,unity&amp;theme=dark" width="836" height="104" x="1754" y="18"/>
  </g>
